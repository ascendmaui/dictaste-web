name: FlowDictate
options:
  bundleIdPrefix: com.johnmatveyev
  createIntermediateGroups: true
targets:
  FlowDictate:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: FlowDictate
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnmatveyev.flowdictate
        PRODUCT_NAME: FlowDictate
        INFOPLIST_FILE: FlowDictate/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: L85AF3V872
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  FlowDictate:
    build:
      targets:
        FlowDictate: all
    run:
      config: Release
